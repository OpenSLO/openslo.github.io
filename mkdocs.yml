# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# Project information
site_name: OpenSLO
site_url: https://openslo.com
site_description: >-
  OpenSLO is a service level objective (SLO) language that declaratively defines
  reliability and performance targets using a simple YAML specification.

# Repository
repo_url: https://github.com/OpenSLO/OpenSLO
repo_name: OpenSLO

# Copyright
copyright: "&copy; 2025 The OpenSLO Contributors | Documentation Distributed under CC BY 4.0 | All Rights Reserved"

# Configuration
theme:
  name: material
  favicon: assets/images/favicon.png
  logo: assets/images/logo2.svg
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - search.highlight
    - search.share
    - content.code.copy

# Plugins
plugins:
  - blog
  - search

# Extensions
markdown_extensions:
  - tables
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Additional configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/slack
      link: https://join.slack.com/t/openslo/shared_invite/zt-1ecraohaa-fqj3C52WF~1zQbwKD8LeMw
    - icon: fontawesome/brands/github
      link: https://github.com/OpenSLO/OpenSLO
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/openslo_

# Additional styles
extra_css:
  - extra.css

# Navigation tree
nav:
  - Home: index.md
  - Specification: specification.md
  - API: 
    - api.md
    - v1alpha: api/v1alpha.md
    - v1: 
      - api/v1.md
      - Service: api/v1/service.md
    - v2alpha: api/v2alpha.md
  - Tools: tools.md
  - Blog:
      - blog/index.md
